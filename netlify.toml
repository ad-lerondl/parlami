[build]
  command = "flutter build web --release && mkdir -p build/web/privacy && cp privacy/index.html build/web/privacy/index.html"
  publish = "build/web"

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/privacy/"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200