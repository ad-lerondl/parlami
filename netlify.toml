[build]
  command = "bash scripts/install_flutter.sh && export PATH=\"$HOME/flutter/bin:$PATH\" && flutter build web --release && cp -R web-pages/privacy build/web/privacy && cp -R web-pages/download build/web/download"
  publish = "build/web"

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/privacy/"
  to = "/privacy/fr/"
  status = 200

[[redirects]]
  from = "/download"
  to = "/download/"
  status = 301

[[redirects]]
  from = "/download/"
  to = "/download/fr/"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200